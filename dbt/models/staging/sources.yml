version: 2

sources:
  - name: silver
    description: >
      Validated access logs from the Polars pipeline, stored as partitioned Parquet.
    schema: main
    tables:
      - name: logs
        description: >
          Silver Parquet files partitioned by dt_partition.
        meta:
          external_location: "read_parquet('{{ env_var('LOG_ANALYTICS_SILVER_PATH', 'data/processed/logs_lake/**/*.parquet') }}', hive_partitioning = true)"
        columns:
          - name: ip
            description: IPv4 address of the client that made the request.
          - name: date
            description: Original timestamp extracted from the Common Log Format line.
          - name: method
            description: HTTP method used by the request.
          - name: endpoint
            description: Requested route, including any query string recorded in the log.
          - name: status
            description: Valid HTTP response status code from 100 through 599.
          - name: size
            description: Non-negative response body size in bytes.
          - name: dt_partition
            description: Request date used as the Hive-style Parquet partition key.
          - name: is_error
            description: True when the HTTP status code is 400 or greater.
